[package]
name = "ditto"
version = "0.1.0"
edition = "2021"
description = "终端剪贴板历史管理器（Ratatui TUI）"

[dependencies]
arboard = "3.6.1"
crossterm = "0.29.0"
dirs = "7.0.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
